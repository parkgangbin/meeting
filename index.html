<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>회의 답변 어시스턴트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#E8EDF1;--surface:#F2F5F7;--panel:#FFFFFF;--ink:#15212B;--muted:#56636F;--faint:#8794A1;--line:#CAD3DB;--line-strong:#97A5B2;
  --marker:#FFE15A;--marker-soft:#FFF0A6;--hl-ink:#15212B;--hl-h:100%;
  --live:#C9433A;--on-live:#FFFFFF;--accent:#1D5B78;--warn:#8A5300;--scrim:rgba(14,22,30,.42);
  --scale:1;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111C26;--surface:#15222E;--panel:#1A2938;--ink:#ECEFEA;--muted:#9AA7B2;--faint:#6E7D8A;--line:#2A3A49;--line-strong:#4C6072;
    --marker:#EED04C;--marker-soft:rgba(238,208,76,.2);--hl-ink:#F2D75A;--hl-h:.14em;
    --live:#F0675C;--on-live:#111C26;--accent:#8CCBE3;--warn:#E8B04A;--scrim:rgba(0,0,0,.52);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111C26;--surface:#15222E;--panel:#1A2938;--ink:#ECEFEA;--muted:#9AA7B2;--faint:#6E7D8A;--line:#2A3A49;--line-strong:#4C6072;
  --marker:#EED04C;--marker-soft:rgba(238,208,76,.2);--hl-ink:#F2D75A;--hl-h:.14em;
  --live:#F0675C;--on-live:#111C26;--accent:#8CCBE3;--warn:#E8B04A;--scrim:rgba(0,0,0,.52);
  color-scheme:dark;
}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,label.btn{font:inherit;color:inherit}
button,label.btn{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg.i{width:20px;height:20px;flex:none}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,2.4vw,28px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:16px;height:10px;border-radius:2px;background:var(--marker);transform:skewX(-14deg)}
.top-status{flex:1;min-width:0;display:flex;gap:14px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
.top-status .alert{color:var(--warn)}
.top-nav{display:flex;gap:2px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:8px;border:1px solid transparent;background:none;font-size:14px;font-weight:500}
.tbtn:hover{background:var(--surface)}
.tbtn[aria-expanded="true"]{border-color:var(--line);background:var(--surface)}

/* center cue */
.stage{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;padding:clamp(16px,3.5vh,44px) clamp(18px,5vw,80px)}
.cue{margin:auto;width:min(100%,1000px)}
.cue-q{margin:0 0 .8em;padding-left:.8em;border-left:3px solid var(--line-strong);color:var(--muted);font-size:calc(clamp(16px,1vw + 11px,24px)*var(--scale));line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.cue-q:empty{display:none}
.cue-a{margin:0;font-size:calc(clamp(26px,2.4vw + 15px,58px)*var(--scale));font-weight:600;line-height:1.36;letter-spacing:-.015em;word-break:keep-all;overflow-wrap:anywhere}
.cue-a.intro{font-size:calc(clamp(24px,1.9vw + 13px,44px)*var(--scale));letter-spacing:-.02em}
.cue-a.soft{color:var(--muted);font-weight:500;font-size:calc(clamp(20px,1.3vw + 12px,32px)*var(--scale))}
.cue-a.streaming::after{content:"";display:inline-block;width:.42em;height:.09em;margin-left:.14em;background:currentColor;vertical-align:.06em;animation:dot 1s infinite}
.cue-sub{margin:.9em 0 0;max-width:40em;color:var(--muted);font-size:calc(clamp(15px,.5vw + 12px,19px)*var(--scale));line-height:1.65;word-break:keep-all}
.cue-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.4em}
.cue-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:1.15em;font-size:13.5px;color:var(--muted)}
.cue-meta:empty{display:none}
.cue-aux{display:grid;gap:10px;max-width:46em;margin-top:1.2em}
.cue-aux:empty{display:none}
.src{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;text-align:left}
.src b{font-weight:600}
.meta-txt{white-space:nowrap}
.warnline{flex-basis:100%;color:var(--warn);font-size:13.5px;line-height:1.5}
.linkbtn{padding:6px 2px;border:0;background:none;color:var(--accent);font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.excerpt{margin:0;padding:10px 14px;border-left:4px solid var(--marker);border-radius:0 8px 8px 0;background:var(--surface);font-size:calc(15.5px*var(--scale));line-height:1.65;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
button.excerpt{cursor:pointer}
.excerpt-src{display:block;margin-bottom:3px;color:var(--muted);font-size:12.5px;white-space:normal}
.say{padding:12px 16px;border-radius:10px;border:1px dashed var(--line-strong);font-size:calc(18px*var(--scale));line-height:1.6;word-break:keep-all}
.say-lbl{display:block;margin-bottom:2px;color:var(--muted);font-size:13px}
.thinking{display:inline-flex;gap:.26em;align-items:center;margin-right:.35em;vertical-align:.12em}
.thinking i{width:.3em;height:.3em;border-radius:50%;background:currentColor;animation:dot 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:.85}}

/* highlighter: the one bold move */
mark.hl{color:var(--hl-ink);background:linear-gradient(var(--marker),var(--marker)) no-repeat 0 100%/100% var(--hl-h);padding:0 .08em;border-radius:.14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl.sweep{animation:hlFull .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes hlFull{from{background-size:0 100%}to{background-size:100% 100%}}
@keyframes hlLine{from{background-size:0 .14em}to{background-size:100% .14em}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark.hl.sweep{animation-name:hlLine}}
:root[data-theme="dark"] mark.hl.sweep{animation-name:hlLine}
mark.ln{color:inherit;background:var(--marker-soft);border-radius:3px;padding:0 .1em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel);font-size:15px;font-weight:500;line-height:1.2;text-align:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.small{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:8px}
.btn.danger{color:var(--live);border-color:var(--live)}
.btn[disabled]{opacity:.45;cursor:default}

/* control bar */
.controls{flex:none;display:flex;align-items:center;gap:10px;padding:10px clamp(12px,2vw,24px);border-top:1px solid var(--line);background:var(--surface)}
.cap,.ask{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;min-height:64px}
.ask{display:none}
.controls.asking .cap{display:none}
.controls.asking .ask{display:flex}
.sq{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.cap-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cap-state{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.cap-state .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.cap-state.live .dot{background:var(--live)}
.cap-lines{max-height:70px;overflow-y:auto;font-size:15px;line-height:1.45;scrollbar-width:none}
.cap-line{display:block;width:100%;margin:0 0 0 -6px;padding:1px 6px;border:0;border-radius:6px;background:none;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-line:last-child{color:var(--ink)}
.cap-line:hover{background:var(--panel)}
.cap-interim{display:block;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-interim:empty{display:none}
.cap-empty{color:var(--muted);font-size:14px}
.ask input{flex:1;min-width:0;height:52px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel);font-size:17px}
.go{flex:none;height:64px;min-width:172px;padding:0 22px;border-radius:14px;border:0;background:var(--marker);color:#15212B;font-size:17px;font-weight:600;line-height:1.22}
.go:active{transform:translateY(1px)}
.mic{position:relative;flex:none;width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--panel);display:grid;place-items:center}
.mic svg{width:26px;height:26px}
.mic.live{background:var(--live);border-color:var(--live);color:var(--on-live)}
.mic.live::after{content:"";position:absolute;top:-7px;left:-7px;right:-7px;bottom:-7px;border-radius:50%;border:2px solid var(--live);animation:breathe 2.6s ease-in-out infinite}
.mic.off{border-style:dashed;color:var(--muted)}
@keyframes breathe{0%,100%{transform:scale(.93);opacity:.12}50%{transform:scale(1.03);opacity:.45}}

/* materials */
.mat{flex:none;display:flex;flex-direction:column;height:27%;min-height:150px;max-height:330px;border-top:1px solid var(--line)}
.mat.closed{height:auto;min-height:0}
.mat.closed .cards{display:none}
.mat-bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px clamp(12px,2vw,24px)}
.tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.cards::-webkit-scrollbar,.cap-lines::-webkit-scrollbar{display:none}
.ftab{flex:none;display:flex;align-items:center;max-width:320px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.ftab.on{border-color:var(--ink)}
.ftab-main{display:flex;align-items:center;gap:8px;min-width:0;height:100%;padding:0 10px 0 12px;border:0;background:none;font-size:13.5px;font-weight:500}
.ftab .kind{font-size:11px;font-weight:600;color:var(--muted)}
.ftab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftab .st{color:var(--muted);font-size:12px;font-weight:400;white-space:nowrap}
.ftab .st.busy::before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--accent);vertical-align:1px;animation:dot 1.1s infinite}
.ftab .st.bad{color:var(--live)}
.ftab .x{flex:none;height:30px;min-width:30px;margin-right:4px;padding:0 4px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;font-size:12.5px;font-weight:600}
.ftab .x.arm{color:var(--live);padding:0 8px}
.cards{position:relative;flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px clamp(12px,2vw,24px) 12px;scroll-snap-type:x proximity}
.page{flex:0 0 clamp(168px,18vw,236px);display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);text-align:left;font-size:12.5px;line-height:1.55;overflow:hidden;scroll-snap-align:start}
.page .loc{flex:none;font-weight:600;font-size:12px;color:var(--muted)}
.page .tx{flex:1;min-height:0;overflow:hidden;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.page.hit{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--marker)}
.page.hit .loc{color:var(--ink)}
.page.note{background:none;border-style:dashed;color:var(--muted)}
.mat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 12px;margin:0 clamp(12px,2vw,24px) 12px;padding:12px;border:1.5px dashed var(--line-strong);border-radius:10px;color:var(--muted);font-size:14px;text-align:center}
.mat.drag .cards{outline:3px dashed var(--accent);outline-offset:-6px}
.mat-msg{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}

/* drawer */
.scrim{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(480px,100%);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(102%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.7,.2,1),visibility 0s linear .24s}
.drawer.on{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.7,.2,1)}
.d-head{flex:none;display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.d-tab{height:40px;padding:0 14px;border-radius:8px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:500}
.d-tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.d-close{margin-left:auto;width:40px;height:40px;border-radius:8px;border:0;background:none;display:grid;place-items:center}
.d-body{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 28px;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.d-body h2{margin:0 0 .35em;font-size:17px;font-weight:600;line-height:1.4}
.d-body h3{margin:1.5em 0 .55em;font-size:14px;font-weight:600;color:var(--muted)}
.d-body p{margin:.4em 0}
.note-file{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.note-file:last-child{border-bottom:0}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.facts li{position:relative;padding-left:15px}
.facts li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:1px;background:var(--marker)}
.qa{margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.qa summary{display:flex;gap:10px;justify-content:space-between;padding:11px 12px;font-weight:500;cursor:pointer;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"답 보기";flex:none;color:var(--accent);font-size:13px}
.qa[open] summary::after{content:"접기"}
.qa .ans{padding:0 12px 12px}
.log-item{padding:11px 0;border-bottom:1px solid var(--line)}
.log-item .t{color:var(--muted);font-size:12.5px}
.log-item .q{color:var(--muted)}
.log-item .a{font-weight:500}
.summary-box{margin:0;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.transcript{display:grid;gap:4px;font-size:14px}
.transcript .t{margin-right:8px;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt input{flex:none;width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}
.opt small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{height:40px;padding:0 16px;border:0;background:var(--panel);font-size:14px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.check{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;line-height:1.5}
.check .lbl{font-weight:600;white-space:nowrap}
.ok{color:var(--accent)}.bad{color:var(--live)}.mid{color:var(--warn)}
.muted{color:var(--muted)}
.fine{color:var(--muted);font-size:13px;line-height:1.55}

/* reader */
.reader{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--scrim)}
.reader.on{display:flex}
.r-card{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.r-head{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.r-title{flex:1;min-width:0;overflow:hidden;font-weight:600;font-size:15px;text-overflow:ellipsis;white-space:nowrap}
.r-body{overflow-y:auto;padding:18px 20px;font-size:calc(16px*var(--scale));line-height:1.75;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.iconbtn[disabled]{opacity:.35;cursor:default}

/* toast */
.toastwrap{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:none}
.toast{max-width:min(92vw,560px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14.5px;line-height:1.45;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none}

.field{display:block;width:100%;height:46px;margin:10px 0 0;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:15px}
.adv{margin-top:12px}
.adv summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500}
.alert-btn{padding:0;border:0;background:none;color:var(--warn);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,31vw,430px)}
.main .stage{min-height:0;padding-left:clamp(18px,4vw,64px);padding-right:clamp(18px,3vw,48px)}
.livepanel{position:relative;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface)}
.live-head{flex:none;display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.live-head strong{font-weight:600;white-space:nowrap}
.live-state{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--faint);transition:transform .15s}
.livepanel.on .live-dot{background:var(--live)}
.livepanel.hearing .live-dot{transform:scale(1.5)}
.live-list{flex:1;min-height:0;overflow-y:auto;padding:8px 6px 18px;font-size:calc(15.5px*var(--scale));line-height:1.55}
.lv{display:grid;grid-template-columns:auto 1fr;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:8px;background:none;text-align:left;word-break:keep-all;overflow-wrap:anywhere}
.lv:hover{background:var(--panel)}
.lv .t{padding-top:.25em;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.lv.q{box-shadow:inset 3px 0 0 var(--marker)}
.lv-interim{margin:0;padding:6px 8px 6px 52px;color:var(--faint)}
.lv-interim:empty{display:none}
.live-empty{margin:0;padding:14px 12px;color:var(--muted);font-size:14px;line-height:1.6}

<script>
(() => {
'use strict';

/* ================= 작은 도구 ================= */
const $ = (s, r) => (r || document).querySelector(s);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const SAFE_LINE = '그 부분은 정확히 확인해서 회의 끝나고 바로 공유드리겠습니다.';

/* ================= 이 기기 안 저장소 (IndexedDB, 실패 시 localStorage) ================= */
const DBN = 'meeting-cue-v1';
const kv = (() => {
  let p = null;
  const open = () => {
    if (p) return p;
    p = new Promise((resolve, reject) => {
      try {
        if (!window.indexedDB) { reject(new Error('no-idb')); return; }

        req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);

    });
    return p;
  };
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      let out;
      const tx = db.transaction('kv', mode);
      const r = fn(tx.objectStore('kv'));
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  };
  const lsKey = (k) => DBN + ':' + k;
  return {
    ok: true,
    async get(k) {
      try { return await run('readonly', (st) => st.get(k)); }
      catch (e) { try { const v = localStorage.getItem(lsKey(k)); return v ? JSON.parse(v) : undefined; } catch (e2) { this.ok = false; return undefined; } }

    async set(k, v) {
      try { await run('readwrite', (st) => st.put(v, k)); return true; }
      catch (e) { try { localStorage.setItem(lsKey(k), JSON.stringify(v)); return true; } catch (e2) { this.ok = false; return false; } }
    },
    async del(k) {
      try { await run('readwrite', (st) => st.delete(k)); } catch (e) {}
      try { localStorage.removeItem(lsKey(k)); } catch (e) {}
    },
  };
})();

/* ================= 상태 ================= */
const S = {
  files: [], segments: [], qaLog: [], summary: null,
  settings: { mode: 'button', scale: 1, matOpen: true, provider: 'gemini', keys: {}, models: {}, leadIn: true },
  activeFile: null, hits: new Set(), current: null, drawer: null, asking: false,
  ai: 'checking', index: null, prepared: [], chunkMap: new Map(), totalChars: 0,
  openQa: new Set(), confirm: '', lastAsk: null, lastQuery: '',
};
let segN = 0;
const readyFiles = () => S.files.filter((f) => f.status === 'ready');
const fileById = (id) => S.files.find((f) => f.id === id) || null;

const studyForSave = (st) => {
  const s = { status: (st && st.status) || 'idle', overview: (st && st.overview) || '', facts: (st && st.facts) || [], qa: (st && st.qa) || [], error: (st && st.error) || '', partial: !!(st && st.partial) };
  if (s.status === 'running' || s.status === 'queued') s.status = (s.facts.length || s.qa.length) ? 'done' : 'idle';
  return s;
};
const fileForSave = (f) => ({ id: f.id, name: f.name, kind: f.kind, size: f.size, addedAt: f.addedAt, warn: f.warn || '', sample: !!f.sample, chunks: f.chunks, study: studyForSave(f.study) });
const save = {
  files: debounce(() => kv.set('files', readyFiles().map(fileForSave)), 500),
  segments: debounce(() => kv.set('segments', S.segments.slice(-5000).map((s) => ({ t: s.t, te: s.te || s.t, text: s.text }))), 1800),
  qaLog: debounce(() => kv.set('qaLog', S.qaLog.slice(-300)), 500),
  settings: debounce(() => kv.set('settings', S.settings), 300),
  summary: debounce(() => kv.set('summary', S.summary && S.summary.status === 'done' ? S.summary : null), 400),
};

/* ================= 외부 라이브러리 (필요할 때만 불러오기) ================= */
const LIBS = {
  xlsx: { ok: () => !!window.XLSX, sets: [
    ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],
    ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'] ] },
  zip: { ok: () => !!window.JSZip, sets: [
    ['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'],
    ['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'] ] },
  pdf: { ok: () => !!(window.pdfjsLib && window.pdfjsWorker), sets: [
    ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js'],
    ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'] ] },
};
const libLoading = {};
const loadScript = (src) => new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = src; s.async = false;
  s.onload = () => resolve();
  s.onerror = () => { s.remove(); reject(new Error('lib ' + src)); };
  document.head.appendChild(s);
});
function needLib(name) {
  const L = LIBS[name];
  if (L.ok()) return Promise.resolve();
  if (libLoading[name]) return libLoading[name];
  libLoading[name] = (async () => {
    let last = null;
    for (const set of L.sets) {
      try { for (const u of set) await loadScript(u); if (L.ok()) return; } catch (e) { last = e; }
    }
    throw last || new Error('lib ' + name);
  })();
  libLoading[name].catch(() => { libLoading[name] = null; });
  return libLoading[name];
}

/* ================= 파일 읽기 ================= */
const NS = {
  a: 'http://schemas.openxmlformats.org/drawingml/2006/main',
  p: 'http://schemas.openxmlformats.org/presentationml/2006/main',
  r: 'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
  c: 'http://schemas.openxmlformats.org/drawingml/2006/chart',
  w: 'http://schemas.openxmlformats.org/wordprocessingml/2006/main',
  rel: 'http://schemas.openxmlformats.org/package/2006/relationships',
};
const KIND_LABEL = { pdf: 'PDF', pptx: 'PPT', xlsx: 'XLS', csv: 'CSV', docx: 'DOC', txt: 'TXT' };

function kindOf(name) {
  const ext = (String(name).split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return 'pdf';
  if (ext === 'pptx') return 'pptx';
  if (ext === 'xlsx' || ext === 'xlsm' || ext === 'xls') return 'xlsx';
  if (ext === 'csv') return 'csv';
  if (ext === 'docx') return 'docx';
  if (ext === 'txt' || ext === 'md' || ext === 'markdown') return 'txt';
  if (ext === 'ppt') return 'old-ppt';
  if (ext === 'doc') return 'old-doc';
  if (ext === 'hwp' || ext === 'hwpx') return 'hwp';
  return '';
}
const clean = (s) => String(s || '').replace(/\r\n?/g, '\n').replace(/\u00a0/g, ' ').replace(/[ \t\f\v]+/g, ' ').replace(/ *\n */g, '\n').replace(/\n{3,}/g, '\n\n').trim();
function readAB(file) {
  if (file.arrayBuffer) return file.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(file); });
}
function decodeText(buf) {
  const u = new Uint8Array(buf);
  if (u[0] === 0xEF && u[1] === 0xBB && u[2] === 0xBF) return new TextDecoder('utf-8').decode(u.subarray(3));
  if (u[0] === 0xFF && u[1] === 0xFE) return new TextDecoder('utf-16le').decode(u.subarray(2));
  if (u[0] === 0xFE && u[1] === 0xFF) return new TextDecoder('utf-16be').decode(u.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u); } catch (e) {}
  try { return new TextDecoder('euc-kr').decode(u); } catch (e) {}
  return new TextDecoder('utf-8').decode(u);
}
function packLines(lines, max) {
  const groups = []; let cur = []; let len = 0;
  const flush = () => { if (cur.length) { groups.push(cur); cur = []; len = 0; } };
  for (const ln of lines) {
    let t = ln.text || '';
    while (t.length > max) { flush(); groups.push([Object.assign({}, ln, { text: t.slice(0, max) })]); t = t.slice(max); }
    if (!t) continue;
    if (len + t.length + 1 > max) flush();
    cur.push(Object.assign({}, ln, { text: t })); len += t.length + 1;
  }
  flush();
  return groups;
}
function pushSplit(out, loc, text, max) {
  max = max || 1800;
  text = clean(text);
  if (text.length <= max * 1.25) { out.push({ loc, text }); return; }
  const groups = packLines(text.split('\n').map((t) => ({ text: t })), max);
  groups.forEach((g, i) => out.push({ loc: loc + ' (' + (i + 1) + '/' + groups.length + ')', text: g.map((x) => x.text).join('\n') }));
}
const xmlDoc = (s) => new DOMParser().parseFromString(s, 'application/xml');
function kids(el) { const out = []; for (let n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 1) out.push(n); return out; }
function paraText(el) {
  let s = '';
  const rec = (node) => {
    for (const k of kids(node)) {
      const ln = k.localName;
      if (ln === 't') s += k.textContent;
      else if (ln === 'br' || ln === 'tab') s += ' ';
      else { if (ln === 'p' && s && !/\s$/.test(s)) s += ' '; rec(k); }
    }
  };
  rec(el);
  return s.replace(/\s+/g, ' ').trim();
}

/* PDF */
function pdfText(items) {
  let out = ''; let prev = null;
  for (const it of items) {
    if (!it || typeof it.str !== 'string') continue;
    const tr = it.transform || [1, 0, 0, 1, 0, 0];
    const x = tr[4], y = tr[5];
    const fs = Math.max(4, Math.abs(tr[3]) || Math.hypot(tr[2], tr[3]) || Math.abs(tr[0]) || 10);
    if (prev && it.str) {
      if (Math.abs(y - prev.y) > fs * 0.45) { if (out && out[out.length - 1] !== '\n') out += '\n'; }
      else {
        const gap = x - prev.end;
        if (gap > fs * 1.5) out += ' | ';
        else if (gap > fs * 0.2 && out && !/\s$/.test(out) && !/^\s/.test(it.str)) out += ' ';
      }
    }
    out += it.str;
    if (it.hasEOL) { out += '\n'; prev = null; }
    else if (it.str) prev = { y, end: x + (it.width || 0) };
  }
  return clean(out);
}
const OCR_PROMPT = '이 이미지는 회의 자료(PDF)의 한 쪽이다. 회의 중 질문에 답할 수 있도록 이 쪽의 내용을 글로 옮겨 적는다.\n' +
  '- 보이는 글자는 빠짐없이 그대로 옮긴다. 숫자와 단위는 보이는 그대로 쓴다.\n' +
  '- 표는 한 줄에 한 행씩, 칸은 " | "로 구분한다. 첫 줄은 머리행이다.\n' +
  '- 차트나 그래프는 제목과 항목별 값을 "항목: 값" 형식으로 쓴다. 지도나 그림 속 글자도 옮긴다.\n' +
  '- 설명, 요약, 추측은 쓰지 않는다. 읽을 수 없는 부분은 건너뛴다.';
async function renderPage(pdf, pn) {
  const page = await pdf.getPage(pn);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(2.5, 1600 / Math.max(base.width, base.height));
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: g, viewport: vp }).promise;
  const url = c.toDataURL('image/jpeg', 0.82);
  try { page.cleanup(); } catch (e) {}
  c.width = 0; c.height = 0;

}
async function parsePdf(file, onProg) {
  await needLib('pdf');

  const data = new Uint8Array(await readAB(file));
  const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false, disableFontFace: true, verbosity: 0 }).promise;
  const useAI = aiUsable();
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    pages.push({ pn: p, text: pdfText(tc.items), ocr: '' });
    try { page.cleanup(); } catch (e) {}
    if (onProg) onProg((p / pdf.numPages) * (useAI ? 0.3 : 1), '글자 읽는 중 ' + p + '/' + pdf.numPages);
    if (p % 3 === 0) await sleep(0);
  }
  const dense = (t) => String(t || '').replace(/\s/g, '').length;
  const need = useAI ? pages.filter((x) => dense(x.text) < 250).slice(0, 40) : [];
  let done = 0, ocrErr = null;
  const one = async (x) => {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const img = await renderPage(pdf, x.pn);
        const r = await callAI(OCR_PROMPT, { modelTier: 'quick', image: { mime: 'image/jpeg', data: img }, maxTokens: 4096 });
        x.ocr = clean(r.text);
        break;
      } catch (e) {
        ocrErr = e;
        if (e && e.code === 'rate_limited' && attempt === 0) { await sleep(8000); continue; }
        if (e && (e.code === 'bad_key' || e.code === 'aq_key')) noteSampleError(e);
        break;
      }
    }
    done++;
    if (onProg) onProg(0.3 + 0.7 * done / need.length, 'AI가 그림 속 글자 읽는 중 ' + done + '/' + need.length);
  };
  for (let i = 0; i < need.length; i += 2) await Promise.all(need.slice(i, i + 2).map(one));
  try { await pdf.destroy(); } catch (e) {}
  const out = []; let empty = 0, ocrN = 0;
  for (const x of pages) {
    const hasText = dense(x.text) >= 8, hasOcr = dense(x.ocr) >= 8;
    if (!hasText && !hasOcr) { empty++; continue; }
    if (hasOcr) ocrN++;
    pushSplit(out, 'p.' + x.pn + (hasOcr ? ' AI 판독' : ''), hasOcr ? x.ocr + (hasText ? '\n\n[원문 글자]\n' + x.text : '') : x.text);
  }
  const msgs = [];
  if (ocrN) msgs.push('그림이 많은 ' + ocrN + '쪽은 AI가 그림 속 글자까지 읽어 넣었어요. 중요한 숫자는 원본과 한 번 대조해 보세요.');
  if (empty) msgs.push(empty + '쪽은 글자를 읽지 못했어요.' + (!aiKey() ? ' 설정에서 API 키를 넣고 파일을 다시 올리면 AI가 그림 속 글자도 읽어요.' : ocrErr ? ' AI 판독도 실패했어요: ' + errCopy(ocrErr) : ''));
  return { chunks: out, warn: msgs.join(' ') };
}

/* PPTX */
async function readRels(zip, partPath) {
  const cut = partPath.lastIndexOf('/');
  const dir = partPath.slice(0, cut), base = partPath.slice(cut + 1);
  const f = zip.file(dir + '/_rels/' + base + '.rels');
  if (!f) return [];
  const doc = xmlDoc(await f.async('string'));
  const els = doc.getElementsByTagNameNS(NS.rel, 'Relationship');
  const out = [];
  for (let i = 0; i < els.length; i++) {
    const e = els[i];
    if (e.getAttribute('TargetMode') === 'External') continue;
    out.push({ id: e.getAttribute('Id'), type: e.getAttribute('Type') || '', path: resolvePath(dir, e.getAttribute('Target') || '') });
  }
  return out;
}
function resolvePath(dir, target) {
  if (target.charAt(0) === '/') return target.slice(1);
  const parts = dir ? dir.split('/') : [];
  target.split('/').forEach((seg) => { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); });
  return parts.join('/');
}
async function slidePaths(zip) {
  try {
    const pf = zip.file('ppt/presentation.xml');
    if (pf) {
      const pres = xmlDoc(await pf.async('string'));
      const byId = {};
      (await readRels(zip, 'ppt/presentation.xml')).forEach((r) => { byId[r.id] = r.path; });
      const ids = pres.getElementsByTagNameNS(NS.p, 'sldId');
      const out = [];
      for (let i = 0; i < ids.length; i++) {
        const rid = ids[i].getAttributeNS(NS.r, 'id') || ids[i].getAttribute('r:id');
        if (byId[rid] && zip.file(byId[rid])) out.push(byId[rid]);
      }
      if (out.length) return out;
    }
  } catch (e) {}
  const num = (s) => Number((s.match(/(\d+)\.xml$/) || [0, 0])[1]);
  return Object.keys(zip.files).filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
}
function drawingLines(root) {
  const lines = [];
  const walk = (el) => {
    for (const k of kids(el)) {
      if (k.namespaceURI === NS.a && k.localName === 'tbl') {
        const rows = k.getElementsByTagNameNS(NS.a, 'tr');
        for (let i = 0; i < rows.length; i++) {
          const cells = rows[i].getElementsByTagNameNS(NS.a, 'tc');
          const vals = [];
          for (let j = 0; j < cells.length; j++) vals.push(paraText(cells[j]));
          while (vals.length && !vals[vals.length - 1]) vals.pop();
          if (vals.some(Boolean)) lines.push(vals.join(' | '));
        }
      } else if (k.namespaceURI === NS.a && k.localName === 'p') {
        const t = paraText(k);
        if (t) lines.push(t);
      } else walk(k);
    }
  };
  walk(root);
  return lines;
}
function childNS(el, ns, name) { for (const k of kids(el)) if (k.namespaceURI === ns && k.localName === name) return k; return null; }
function fmtChartNum(v, fc) {
  const n = Number(v);
  if (!isFinite(n) || v === '') return v;
  if (/%/.test(fc || '')) { const d = ((String(fc).split('.')[1] || '').match(/0/g) || []).length; return (n * 100).toFixed(d) + '%'; }
  if (Number.isInteger(n) && Math.abs(n) >= 1000) return n.toLocaleString('ko-KR');
  return String(Math.round(n * 1000) / 1000);
}
function ptMap(el, numeric) {
  const m = new Map();
  const fcEl = el.getElementsByTagNameNS(NS.c, 'formatCode')[0];
  const fc = fcEl ? fcEl.textContent : '';
  const pts = el.getElementsByTagNameNS(NS.c, 'pt');
  for (let i = 0; i < pts.length; i++) {
    const ix = Number(pts[i].getAttribute('idx'));
    const vEl = pts[i].getElementsByTagNameNS(NS.c, 'v')[0];
    if (!vEl || m.has(ix)) continue;
    const v = vEl.textContent.trim();
    m.set(ix, numeric ? fmtChartNum(v, pts[i].getAttribute('formatCode') || fc) : v);
  }
  return m;
}
function chartLines(doc) {
  const out = [];
  const title = doc.getElementsByTagNameNS(NS.c, 'title')[0];
  if (title) {
    const ts = title.getElementsByTagNameNS(NS.a, 't'); let t = '';
    for (let i = 0; i < ts.length; i++) t += ts[i].textContent;
    if (t.trim()) out.push('[차트] ' + t.trim());
  }
  const sers = doc.getElementsByTagNameNS(NS.c, 'ser');
  for (let i = 0; i < sers.length; i++) {
    const ser = sers[i];
    const tx = childNS(ser, NS.c, 'tx');
    let name = '';
    if (tx) { const v = tx.getElementsByTagNameNS(NS.c, 'v')[0]; name = v ? v.textContent.trim() : paraText(tx); }
    const cat = childNS(ser, NS.c, 'cat') || childNS(ser, NS.c, 'xVal');
    const val = childNS(ser, NS.c, 'val') || childNS(ser, NS.c, 'yVal');
    const cats = cat ? ptMap(cat, false) : new Map();
    const vals = val ? ptMap(val, true) : new Map();
    const pairs = Array.from(vals.keys()).sort((a, b) => a - b).slice(0, 60).map((ix) => (cats.has(ix) ? cats.get(ix) + ' ' : '') + vals.get(ix));
    if (pairs.length) out.push('[차트 값] ' + (name ? name + ': ' : '') + pairs.join(', '));
  }

}
async function parsePptx(file, onProg) {
  await needLib('zip');
  const zip = await JSZip.loadAsync(await readAB(file));
  const paths = await slidePaths(zip);
  const out = [];
  for (let i = 0; i < paths.length; i++) {
    const sf = zip.file(paths[i]);
    if (!sf) continue;
    const lines = drawingLines(xmlDoc(await sf.async('string')));
    let notes = '';
    for (const r of await readRels(zip, paths[i])) {
      const part = zip.file(r.path);
      if (!part) continue;
      if (/\/notesSlide$/.test(r.type)) {
        notes = drawingLines(xmlDoc(await part.async('string'))).filter((t) => !/^\d+$/.test(t)).join(' ');
      } else if (/\/chart$/.test(r.type)) {
        chartLines(xmlDoc(await part.async('string'))).forEach((t) => lines.push(t));
      } else if (/\/diagramData$/.test(r.type)) {
        const d = xmlDoc(await part.async('string'));
        const ts = d.getElementsByTagNameNS(NS.a, 't'); const arr = [];
        for (let k = 0; k < ts.length; k++) { const t = ts[k].textContent.trim(); if (t) arr.push(t); }
        if (arr.length) lines.push('[도형] ' + arr.join(' / '));
      }
    }
    let text = lines.join('\n');
    if (notes) text += '\n[발표자 노트] ' + notes;
    if (text.trim()) pushSplit(out, '슬라이드 ' + (i + 1), text);
    if (onProg) onProg((i + 1) / paths.length);
  }
  return { chunks: out };
}

/* Excel, CSV */
function sheetChunks(wb, single) {
  const out = [];
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) continue;
    let start = 0;
    try { start = XLSX.utils.decode_range(ws['!ref']).s.r; } catch (e) {}
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: true });
    const lines = [];
    for (let i = 0; i < rows.length && lines.length < 20000; i++) {
      const cells = (rows[i] || []).map((v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim());
      while (cells.length && !cells[cells.length - 1]) cells.pop();
      if (!cells.some(Boolean)) continue;
      lines.push({ text: cells.join(' | '), n: start + i + 1 });
    }
    if (!lines.length) continue;
    const header = lines[0].text.slice(0, 400);
    packLines(lines, 1500).forEach((g, gi) => {
      const a = g[0].n, b = g[g.length - 1].n;
      const rowsLbl = a === b ? a + '행' : a + '–' + b + '행';
      out.push({ loc: single ? rowsLbl : name + ' 시트 ' + rowsLbl, text: (gi > 0 ? '[머리행] ' + header + '\n' : '') + g.map((l) => l.text).join('\n') });
    });
  }
  return out;
}
async function parseXlsx(file) {
  await needLib('xlsx');
  const wb = XLSX.read(new Uint8Array(await readAB(file)), { type: 'array' });
  return { chunks: sheetChunks(wb, false) };
}
async function parseCsv(file) {
  await needLib('xlsx');
  const wb = XLSX.read(decodeText(await readAB(file)), { type: 'string', raw: true });
  return { chunks: sheetChunks(wb, true) };
}

/* Word, 텍스트 */
function isHead(p) {
  const ps = p.getElementsByTagNameNS(NS.w, 'pStyle')[0];
  const v = ps ? (ps.getAttributeNS(NS.w, 'val') || ps.getAttribute('w:val') || '') : '';
  return /heading|title|제목/i.test(v) || !!p.getElementsByTagNameNS(NS.w, 'outlineLvl')[0];
}
async function parseDocx(file) {
  await needLib('zip');
  const zip = await JSZip.loadAsync(await readAB(file));
  const df = zip.file('word/document.xml');
  if (!df) throw new Error('docx');
  const doc = xmlDoc(await df.async('string'));
  const body = doc.getElementsByTagNameNS(NS.w, 'body')[0];
  const lines = [];
  const walk = (el) => {
    for (const k of kids(el)) {
      if (k.namespaceURI === NS.w && k.localName === 'p') {
        const t = paraText(k);
        if (t) lines.push({ text: t, head: isHead(k) });
      } else if (k.namespaceURI === NS.w && k.localName === 'tbl') {
        const rows = k.getElementsByTagNameNS(NS.w, 'tr');
        for (let i = 0; i < rows.length; i++) {
          const cells = rows[i].getElementsByTagNameNS(NS.w, 'tc'); const vals = [];
          for (let j = 0; j < cells.length; j++) vals.push(paraText(cells[j]));
          while (vals.length && !vals[vals.length - 1]) vals.pop();
          if (vals.some(Boolean)) lines.push({ text: vals.join(' | ') });
        }
      } else walk(k);
    }
  };
  if (body) walk(body);
  const out = []; let cur = []; let len = 0; let head = ''; let k = 0;
  const flush = () => {
    if (!cur.length) return;
    k++;
    pushSplit(out, '부분 ' + k + (head ? ' ' + head.slice(0, 18) : ''), cur.join('\n'));
    cur = []; len = 0;
  };
  for (const l of lines) {
    if (l.head && len > 300) flush();
    if (l.head) head = l.text;
    if (len + l.text.length > 1600) flush();
    cur.push(l.text); len += l.text.length + 1;
  }
  flush();
  return { chunks: out };
}
async function parseTxt(file) {
  const text = clean(decodeText(await readAB(file)));
  const paras = text.split(/\n\s*\n/).map((p) => ({ text: p.trim() })).filter((p) => p.text);
  return { chunks: packLines(paras, 1600).map((g, i) => ({ loc: '부분 ' + (i + 1), text: g.map((x) => x.text).join('\n\n') })) };
}
function parseFile(file, kind, onProg) {
  if (kind === 'pdf') return parsePdf(file, onProg);
  if (kind === 'pptx') return parsePptx(file, onProg);
  if (kind === 'xlsx') return parseXlsx(file);
  if (kind === 'csv') return parseCsv(file);
  if (kind === 'docx') return parseDocx(file);
  return parseTxt(file);
}

/* ================= 자료 찾기 (한국어 2글자 단위 BM25) ================= */
function tokens(s) {
  const out = [];
  const str = String(s || '').toLowerCase().replace(/(\d),(?=\d{3})/g, '$1');
  const units = str.match(/\d+(?:\.\d+)?\s?[\uac00-\ud7a3%]/g);
  if (units) for (const u of units) out.push(u.replace(/\s/g, ''));
  const runs = str.match(/[\uac00-\ud7a3]+|[a-z]+|\d+(?:\.\d+)?/g);
  if (!runs) return out;
  for (const r of runs) {
    const c = r.charCodeAt(0);
    if (c >= 0xac00 && c <= 0xd7a3) {
      if (r.length === 1) out.push(r);
      else for (let i = 0; i < r.length - 1; i++) out.push(r.substr(i, 2));
    } else if (r.length > 1 || /\d/.test(r)) out.push(r);
  }
  return out;
}
function buildIndex() {
  const docs = []; const df = new Map(); let total = 0;
  S.chunkMap = new Map(); S.totalChars = 0;
  for (const f of readyFiles()) {
    const ft = new Set(tokens(shortName(f.name)));
    for (const c of f.chunks) {
      S.chunkMap.set(c.id, { c, f });
      S.totalChars += c.text.length;
      const toks = tokens(c.text + '\n' + c.loc);
      const tf = new Map();
      for (const t of toks) tf.set(t, (tf.get(t) || 0) + 1);
      tf.forEach((v, t) => df.set(t, (df.get(t) || 0) + 1));
      docs.push({ c, f, tf, ft, len: toks.length || 1 });
      total += toks.length;
    }
  }
  S.index = { docs, df, N: docs.length, avg: docs.length ? total / docs.length : 1 };
}
function idf(t) {
  if (!S.index) return 1;
  const n = S.index.df.get(t) || 0;
  return Math.log(1 + (S.index.N - n + 0.5) / (n + 0.5));
}
function rank(query) {
  if (!S.index || !S.index.N) return [];
  const q = Array.from(new Set(tokens(query).concat(tokens(String(query || '').replace(/\s+/g, '')))));
  const out = [];
  for (const d of S.index.docs) {
    let s = 0;
    for (const t of q) {
      const f = d.tf.get(t);
      if (f) s += idf(t) * (f * 2.2) / (f + 1.2 * (0.25 + 0.75 * d.len / S.index.avg));
    }
    if (s > 0) { let fo = 0; for (const t of q) if (d.ft.has(t)) fo++; if (fo) s *= 1 + Math.min(0.3, 0.08 * fo); }
    out.push({ c: d.c, f: d.f, s });
  }
  out.sort((a, b) => b.s - a.s);
  return out;
}
const FIG = /\d[\d,.]*\s?(?:%|억|만|원|명|개|건|배|점|위|곳|평|㎡|톤|조|천|달러|bp)/;
function bestLines(text, query, n) {
  const q = new Set(tokens(query).concat(tokens(String(query || '').replace(/\s+/g, ''))));
  if (!q.size) return '';
  const lines = String(text).replace(/([.!?])\s+/g, '$1\n').split('\n').map((s) => s.trim()).filter((s) => s.length > 2);
  const scored = lines.map((ln, i) => {
    let s = 0; const seen = new Set();
    for (const t of tokens(ln)) if (q.has(t) && !seen.has(t)) { seen.add(t); const w = idf(t); s += w * w; }
    if (s > 0 && FIG.test(ln)) s *= 1.5;
    return { ln, i, s };
  });
  return scored.filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, n || 2).sort((a, b) => a.i - b.i)
    .map((x) => (x.ln.length > 220 ? x.ln.slice(0, 220) + '…' : x.ln)).join('\n');
}
function buildPrepared() {
  S.prepared = [];
  for (const f of readyFiles()) {
    if (!f.study || !f.study.qa) continue;
    for (const it of f.study.qa) S.prepared.push({ q: it.q, a: it.a, src: it.src || [], f, toks: new Set(tokens(it.q)) });
  }
}
function matchPrepared(query) {
  const qt = new Set(tokens(query));
  if (qt.size < 3 || !S.prepared.length) return null;
  let best = null;
  for (const p of S.prepared) {
    if (!p.toks.size) continue;
    let inter = 0;
    p.toks.forEach((t) => { if (qt.has(t)) inter++; });
    const score = 0.5 * (2 * inter / (qt.size + p.toks.size)) + 0.5 * (inter / p.toks.size);
    if (!best || score > best.score) best = { p, score };
  }
  return best && best.score >= 0.42 ? best : null;
}
function pickContext(query) {
  const ranked = rank(query);
  let picked;
  if (S.totalChars <= 14000) picked = ranked;
  else {
    picked = []; let used = 0;
    for (const h of ranked) {
      if (picked.length >= 10 || (h.s <= 0 && picked.length >= 2)) break;
      const len = Math.min(h.c.text.length, 2600);
      if (used + len > 10000 && picked.length >= 3) break;
      picked.push(h); used += len;
    }
  }
  return picked.map((h, i) => ({ n: i + 1, c: h.c, f: h.f, s: h.s, text: h.c.text.length > 2600 ? h.c.text.slice(0, 2600) + '…' : h.c.text }));
}
const srcOf = (ids) => (ids || []).map((id) => S.chunkMap.get(id)).filter(Boolean);
function notesText(maxChars) {
  const lines = [];
  for (const f of readyFiles()) {
    const st = f.study;
    if (!st) continue;
    if (st.overview) lines.push('「' + shortName(f.name) + '」 요지: ' + st.overview);
    (st.facts || []).forEach((x) => { const s = srcOf(x.src)[0]; lines.push('- ' + x.text + (s ? ' (' + shortName(s.f.name) + ' ' + s.c.loc + ')' : '')); });
  }
  let out = '';
  for (const l of lines) { if (out.length + l.length > maxChars) break; out += l + '\n'; }
  return out.trim();
}

function refresh() {
  renderTop();
  renderMaterials();
  if (S.drawer) renderDrawer(true);

}
function renderTop() {
  const parts = [];
  const ready = readyFiles();
  if (!S.files.length) parts.push('<span>자료 없음</span>');
  else {
    const parsing = S.files.some((f) => f.status === 'parsing');
    const studying = ready.some((f) => f.study && (f.study.status === 'running' || f.study.status === 'queued'));
    const done = ready.length && ready.every((f) => f.study && f.study.status === 'done');
    parts.push('<span>자료 ' + ready.length + '개' + (parsing ? ', 읽는 중' : studying ? ', AI가 공부 중' : done ? ', 공부 완료' : '') + '</span>');
  }
  if (S.ai === 'absent') parts.push('<button class="alert-btn" data-open="settings">API 키를 넣으면 AI가 답해요</button>');
  else if (S.ai === 'denied') parts.push('<button class="alert-btn" data-open="settings">API 키를 확인해 주세요</button>');
  if (S.settings.mode === 'auto') parts.push('<span>자동 답변 켜짐</span>');
  $('#topStatus').innerHTML = parts.join('');
}
function fileStatus(f) {
  if (f.status === 'parsing') return { text: f.progressText || ('읽는 중 ' + Math.round((f.progress || 0) * 100) + '%'), busy: true };
  if (f.status === 'error') return { text: '읽기 실패', bad: true };
  const st = f.study || {};
  if (st.status === 'queued') return { text: '공부 대기', busy: true };
  if (st.status === 'running') return { text: '공부 중' + (st.parts > 1 ? ' ' + st.part + '/' + st.parts : ''), busy: true };
  if (st.status === 'done') return { text: '공부 완료' };
  if (st.status === 'error') return { text: '공부 못 함', bad: true };
  return { text: '' };
}
function renderMaterials() {
  const mat = $('#mat'), tabs = $('#tabs'), cards = $('#cards');
  mat.classList.toggle('closed', !S.settings.matOpen);
  const fold = $('#btnFold');
  fold.textContent = S.settings.matOpen ? '접기' : '자료 보기';
  fold.setAttribute('aria-expanded', S.settings.matOpen ? 'true' : 'false');
  if (!S.files.length) {
    tabs.innerHTML = '';

    return;
  }
  if (!fileById(S.activeFile)) S.activeFile = S.files[0].id;
  tabs.innerHTML = S.files.map((f) => {
    const on = f.id === S.activeFile;

    return '<div class="ftab' + (on ? ' on' : '') + '"><button class="ftab-main" role="tab" aria-selected="' + on + '" data-file="' + f.id + '">' +
      '<span class="kind">' + (f.sample ? '샘플' : (KIND_LABEL[f.kind] || '')) + '</span><span class="nm">' + escText(shortName(f.name)) + '</span>' +
      (st.text ? '<span class="st' + (st.busy ? ' busy' : '') + (st.bad ? ' bad' : '') + '">' + escText(st.text) + '</span>' : '') + '</button>' +
      (on ? '<button class="x' + (armed ? ' arm' : '') + '" data-act="rm" data-file="' + f.id + '" aria-label="' + escAttr(f.name) + ' 목록에서 빼기">' + (armed ? '빼기' : ICON.x) + '</button>' : '') + '</div>';
  }).join('');
  renderCards();
}
function renderCards() {
  const f = fileById(S.activeFile), cards = $('#cards');
  if (!f) { cards.innerHTML = ''; return; }
  if (f.status === 'parsing') { cards.innerHTML = '<div class="mat-msg">' + escText(f.progressText || ('읽는 중이에요. ' + Math.round((f.progress || 0) * 100) + '%')) + '</div>'; return; }
  if (f.status === 'error') { cards.innerHTML = '<div class="mat-msg">' + escText(f.error || '파일을 읽지 못했어요.') + '</div>'; return; }
  let h = '';
  if (f.warn) h += '<div class="page note"><span class="loc">알림</span><span class="tx">' + escText(f.warn) + '</span></div>';
  if (f.study && f.study.status === 'error') h += '<div class="page note"><span class="loc">AI 공부 실패</span><span class="tx">' + escText(f.study.error || '') + '</span><button class="linkbtn" data-act="restudy" data-file="' + f.id + '">다시 공부하기</button></div>';

function markHits(ids) {
  S.hits = new Set(ids);
  const first = ids.length ? S.chunkMap.get(ids[0]) : null;
  if (first && first.f.id !== S.activeFile) { S.activeFile = first.f.id; renderMaterials(); }
  else $$('#cards .page[data-chunk]').forEach((el) => el.classList.toggle('hit', S.hits.has(el.getAttribute('data-chunk'))));
  if (!first) return;
  const box = $('#cards');
  const el = $$('#cards .page[data-chunk]').find((x) => x.getAttribute('data-chunk') === ids[0]);
  if (el) {
    const left = Math.max(0, el.offsetLeft - (box.clientWidth - el.clientWidth) / 2);
    try { box.scrollTo({ left, behavior: 'smooth' }); } catch (e) { box.scrollLeft = left; }
  }
}

    return '<div class="log-item"><div class="t">' + hhmm(x.t) + tag + '</div><div class="q">' + escText(x.q) + '</div><div class="a">' + hl(x.a) + '</div>' + (x.src && x.src.length ? srcLink(x.src) : '') + '</div>';
  }).join('') : '<p class="muted">아직 받은 질문이 없어요.</p>';
  h += '<h3>자막 ' + S.segments.length + '줄</h3>';
  h += S.segments.length ? '<div class="transcript">' + S.segments.slice(-400).map((s) => '<div><span class="t">' + hhmm(s.t) + '</span>' + escText(s.text) + '</div>').join('') + '</div>' : '<p class="muted">마이크를 켜면 회의 자막이 쌓여요.</p>';
  return h;
}
function settingsHtml() {
  const m = S.settings.mode;
  const opt = (v, title, sub) => '<label class="opt"><input type="radio" name="mode" value="' + v + '"' + (m === v ? ' checked' : '') + '><span>' + title + '<small>' + sub + '</small></span></label>';
  let h = aiSettingsHtml() + '<h3>답변 방식</h3>';
  h += opt('button', '버튼을 누를 때만 (추천)', '나에게 온 질문인지는 내가 판단하고 ‘방금 질문에 답하기’를 누릅니다. 이미 지나간 질문에도 답할 수 있어요.');
  h += opt('auto', '질문이 들리면 자동으로', '질문 말투가 들리면 바로 답을 띄웁니다. 다른 사람끼리 주고받는 질문에도 답이 뜰 수 있어요.');
  h += '<label class="opt"><input type="checkbox" name="leadIn"' + (S.settings.leadIn !== false ? ' checked' : '') + '><span>말머리 이어 주기<small>‘9월 본점 매출은’처럼 내가 말을 꺼내고 잠깐 멈추면, 자료에서 찾아 이어서 말할 내용을 바로 띄워요. 회의 자료에 나오는 말로 시작할 때만 동작해요.</small></span></label>';
  h += '<h3>답변 글자 크기</h3><div class="seg" role="group" aria-label="답변 글자 크기">' +
    [[0.85, '작게'], [1, '보통'], [1.2, '크게']].map((x) => '<button data-act="scale" data-v="' + x[0] + '" aria-pressed="' + (S.settings.scale === x[0]) + '">' + x[1] + '</button>').join('') + '</div>';
  const rows = [];
  if (!SR) rows.push(['bad', '음성 인식', '이 브라우저에서는 안 돼요. 갤럭시탭은 크롬, 아이패드는 사파리에서 열어 주세요. 그동안은 키보드 받아쓰기로 질문을 넣을 수 있어요.']);
  else if (sp.blocked || micPolicy() === false) rows.push(['bad', '음성 인식', '마이크가 막혀 있어요. 주소창 왼쪽 아이콘을 눌러 권한에서 마이크를 허용한 뒤 새로고침해 주세요.']);
  else rows.push(['ok', '음성 인식', sp.want ? '듣고 있어요.' : '지원돼요. 마이크를 처음 켤 때 권한을 물어보면 허용해 주세요.']);
  const pn = aiProv() === 'claude' ? 'Claude' : 'Gemini';
  if (!aiKey()) rows.push(['bad', 'AI 답변', '맨 위 AI 연결에 API 키를 넣어 주세요. 지금은 자료 원문만 보여드려요.']);
  else if (S.ai === 'denied') rows.push(['bad', 'AI 답변', '키가 거절됐어요. 맨 위에서 키를 다시 넣어 주세요. 지금은 자료 원문만 보여드려요.']);
  else if (S.aiOk) { const rv = (S.settings.resolved || {})[aiProv()] || {}; rows.push(['ok', 'AI 답변', pn + '에 연결됐어요. 빠른 답변 ' + escText(rv.quick || '-') + ', 공부 ' + escText(rv.deep || '-')]); }
  else rows.push(['mid', 'AI 답변', pn + ' 키가 저장돼 있어요. ‘연결 확인’으로 시험해 보세요.']);
  if (wake.status === 'on') rows.push(['ok', '화면 꺼짐', '마이크를 켜 둔 동안 화면이 꺼지지 않게 해 두었어요.']);
  else if (wake.status === 'denied' || wake.status === 'unsupported' || wake.status === 'released') rows.push(['mid', '화면 꺼짐', '이 화면에서는 자동으로 막을 수 없어요. 태블릿 설정에서 화면 자동 꺼짐 시간을 길게 바꿔 두세요.']);
  else rows.push(['mid', '화면 꺼짐', '마이크를 켜면 화면 꺼짐 방지를 시도해요. 안 되면 태블릿 설정에서 자동 꺼짐 시간을 길게 해 두세요.']);
  rows.push([kv.ok ? 'ok' : 'mid', '저장 위치', kv.ok ? '자료와 기록은 이 태블릿의 브라우저에만 저장돼요.' : '이 브라우저에서는 저장이 안 돼요. 새로고침하면 자료를 다시 올려야 해요.']);
  h += '<h3>회의 전 점검</h3><div class="check">' + rows.map((r) => '<span class="lbl ' + r[0] + '">' + r[1] + '</span><span>' + r[2] + '</span>').join('') + '</div>';
  h += '<p class="fine">안드로이드에서 마이크가 다시 켜질 때 ‘띵’ 소리가 나면 태블릿 미디어 볼륨을 줄여 두세요. 회의 전에 샘플 질문 하나로 마이크와 답변을 시험해 보는 걸 권해요.</p>';
  h += '<h3>데이터</h3><p class="fine">자료, 자막, 질문과 답은 이 태블릿 브라우저에만 저장돼요. 답을 만들 때는 질문과 관련된 자료 일부만 선택한 AI(Google Gemini 또는 Anthropic Claude)로 보내요. 실제 사내 자료 대신 가상 데이터로 써 보세요.</p>';
  const a1 = S.confirm === 'clear-files', a2 = S.confirm === 'clear-log';
  h += '<div class="row"><button class="btn small' + (a1 ? ' danger' : '') + '" data-act="clear-files">' + (a1 ? '정말 지울까요? 한 번 더 누르기' : '자료 모두 지우기') + '</button>' +
    '<button class="btn small' + (a2 ? ' danger' : '') + '" data-act="clear-log">' + (a2 ? '정말 지울까요? 한 번 더 누르기' : '회의 기록 지우기') + '</button></div>';
  return h;
}

/* 원문 보기 */
const reader = { fileId: null, idx: 0, opener: null };
function openReader(chunkId) {
  const hit = S.chunkMap.get(chunkId);
  if (!hit) return;
  reader.opener = document.activeElement;
  reader.fileId = hit.f.id;
  reader.idx = hit.f.chunks.indexOf(hit.c);
  renderReader();
  $('#reader').classList.add('on');
  $('#rClose').focus();
}
function renderReader() {
  const f = fileById(reader.fileId);
  if (!f || !f.chunks[reader.idx]) { closeReader(); return; }
  const c = f.chunks[reader.idx];
  $('#rTitle').textContent = shortName(f.name) + '  ' + c.loc;
  let html = escText(c.text);
  const best = S.lastQuery ? bestLines(c.text, S.lastQuery, 3) : '';
  if (best) best.split('\n').forEach((ln) => { const raw = ln.replace(/…$/, ''); if (raw.length > 3) html = html.split(escText(raw)).join('<mark class="ln">' + escText(raw) + '</mark>'); });
  $('#rBody').innerHTML = html;
  $('#rBody').scrollTop = 0;
  $('#rPrev').disabled = reader.idx <= 0;
  $('#rNext').disabled = reader.idx >= f.chunks.length - 1;
}
function closeReader() {
  $('#reader').classList.remove('on');
  if (reader.opener && reader.opener.focus) { try { reader.opener.focus(); } catch (e) {} }
}

let toastT = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 3600);
}
let confirmT = 0;
function arm(key) {
  S.confirm = key;
  clearTimeout(confirmT);
  confirmT = setTimeout(() => { S.confirm = ''; renderMaterials(); if (S.drawer) renderDrawer(true); }, 4000);
}

/* ================= 이벤트 ================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-chunk],[data-file],[data-seg],[data-open],[data-tab]');
  if (!t) return;
  const act = t.getAttribute('data-act');
  if (act) {
    e.preventDefault();
    if (act === 'sample') loadSample();
    else if (act === 'ask') openAsk();
    else if (act === 'retry') { if (S.lastAsk) answer({ question: S.lastAsk.question, recent: S.lastAsk.recent, lead: S.lastAsk.lead, fresh: true }); }
    else if (act === 'rm') {
      const id = t.getAttribute('data-file');
      if (S.confirm === 'rm:' + id) { S.confirm = ''; removeFile(id); } else { arm('rm:' + id); renderMaterials(); }
    }
    else if (act === 'restudy') { const f = fileById(t.getAttribute('data-file')); if (f) queueStudy(f); }
    else if (act === 'summarize') makeSummary();
    else if (act === 'copy-summary') { if (S.summary && S.summary.text) copyText(S.summary.text); }
    else if (act === 'save-summary') { if (S.summary && S.summary.text) saveSummary(); }
    else if (act === 'provider') { S.settings.provider = t.getAttribute('data-v') === 'claude' ? 'claude' : 'gemini'; S.aiOk = false; S.ai = aiKey() ? 'ready' : 'absent'; save.settings(); renderTop(); renderDrawer(true); if (isIdle()) paintIdle(); }
    else if (act === 'save-key') {
      const v = (($('#keyInput') || {}).value || '').trim();
      if (!v) { toast('API 키를 붙여 넣어 주세요.'); return; }
      S.settings.keys = Object.assign({}, S.settings.keys); S.settings.keys[aiProv()] = v; S.aiOk = false; S.ai = 'ready';
      save.settings(); renderTop(); renderDrawer(true); testKey();
    }
    else if (act === 'test-key') testKey();
    else if (act === 'load-models') { discoverGemini().then((d) => { S.settings.gemDiscover = d; save.settings(); renderDrawer(true); }).catch((e2) => toast(errCopy(e2))); }
    else if (act === 'clear-key') { S.settings.keys = Object.assign({}, S.settings.keys); delete S.settings.keys[aiProv()]; S.aiOk = false; S.ai = 'absent'; save.settings(); renderTop(); renderDrawer(true); if (isIdle()) paintIdle(); toast('키를 지웠어요.'); }
    else if (act === 'save-models') { S.settings.models = Object.assign({}, S.settings.models); S.settings.models[aiProv()] = { quick: (($('#mQuick') || {}).value || '').trim(), deep: (($('#mDeep') || {}).value || '').trim() }; save.settings(); toast('모델 설정을 저장했어요.'); }
    else if (act === 'scale') { S.settings.scale = Number(t.getAttribute('data-v')) || 1; applyScale(); save.settings(); renderDrawer(true); }
    else if (act === 'new-meeting' || act === 'clear-log') {
      if (S.confirm === act) {
        S.confirm = ''; S.segments = []; S.qaLog = []; S.summary = null;
        save.segments(); save.qaLog(); kv.set('summary', null);
        renderCaptions(); renderDrawer(true); toast('자막과 질문 기록을 지웠어요.');
      } else { arm(act); renderDrawer(true); }
    }
    else if (act === 'clear-files') {
      if (S.confirm === act) {
        S.confirm = '';
        S.files.slice().forEach((f) => removeFile(f.id));
        kv.del('files');
        S.current = null; refresh(); toast('올린 자료를 모두 지웠어요.');
      } else { arm(act); renderDrawer(true); }
    }
    return;
  }
  if (t.hasAttribute('data-open')) { const tab = t.getAttribute('data-open'); if (S.drawer === tab) closeDrawer(); else openDrawer(tab); return; }
  if (t.hasAttribute('data-tab')) { S.drawer = t.getAttribute('data-tab'); openDrawer(S.drawer); return; }
  if (t.hasAttribute('data-chunk')) { openReader(t.getAttribute('data-chunk')); return; }
  if (t.hasAttribute('data-seg')) {
    const id = Number(t.getAttribute('data-seg'));
    const i = S.segments.findIndex((s) => s.id === id);
    if (i >= 0) {
      const prev = S.segments[i - 1];
      answer({ question: S.segments[i].text, recent: prev && S.segments[i].t - prev.t < 20000 ? [prev.text] : [] });
    }
    return;
  }
  if (t.hasAttribute('data-file')) { S.activeFile = t.getAttribute('data-file'); S.confirm = ''; renderMaterials(); }
});
$('#dBody').addEventListener('change', (e) => {
  const t = e.target;
  if (t && t.getAttribute && t.getAttribute('data-model')) {
    const tier = t.getAttribute('data-model'), prov = aiProv();
    const mm = Object.assign({}, S.settings.models); mm[prov] = Object.assign({}, mm[prov]);
    if (t.value) mm[prov][tier] = t.value; else delete mm[prov][tier];
    S.settings.models = mm;
    const rs = Object.assign({}, S.settings.resolved); rs[prov] = Object.assign({}, rs[prov]); delete rs[prov][tier]; S.settings.resolved = rs;
    save.settings();
    toast((tier === 'quick' ? '빠른 답변' : '공부와 요약') + ' 모델: ' + (t.value || '자동'));
    return;
  }
  if (t && t.name === 'leadIn') { S.settings.leadIn = !!t.checked; save.settings(); toast(t.checked ? '말머리 이어 주기를 켰어요.' : '말머리 이어 주기를 껐어요.'); return; }
  if (t && t.name === 'mode') { S.settings.mode = t.value === 'auto' ? 'auto' : 'button'; save.settings(); renderTop(); if (isIdle()) paintIdle(); }
});
$('#dBody').addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d || !d.getAttribute) return;
  const key = d.getAttribute('data-key');
  if (!key) return;
  if (d.open) S.openQa.add(key); else S.openQa.delete(key);
}, true);
$('#btnMic').addEventListener('click', () => { if (sp.want) micStop(); else micStart(); });
$('#btnGo').addEventListener('click', () => {
  if (S.asking && $('#askInput').value.trim()) { submitAsk(); return; }
  if (S.asking && !sp.want) { submitAsk(); return; }
  answer({ recent: recentLines(25000, 4) });
});
$('#btnType').addEventListener('click', openAsk);
$('#liveJump').addEventListener('click', () => { const l = $('#liveList'); l.scrollTop = l.scrollHeight; $('#liveJump').hidden = true; });
$('#liveList').addEventListener('scroll', () => { const l = $('#liveList'); if (l.scrollHeight - l.scrollTop - l.clientHeight < 90) $('#liveJump').hidden = true; });
$('#askClose').addEventListener('click', closeAsk);
$('#askInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submitAsk(); }
  else if (e.key === 'Escape') closeAsk();
});
$('#btnFold').addEventListener('click', () => { S.settings.matOpen = !S.settings.matOpen; save.settings(); renderMaterials(); });
$('#fileInput').addEventListener('change', (e) => { const files = e.target.files; if (files && files.length) addFiles(files); e.target.value = ''; });
$('#scrim').addEventListener('click', closeDrawer);
$('#dClose').addEventListener('click', closeDrawer);
$('#rClose').addEventListener('click', closeReader);
$('#rPrev').addEventListener('click', () => { if (reader.idx > 0) { reader.idx--; renderReader(); } });
$('#rNext').addEventListener('click', () => { const f = fileById(reader.fileId); if (f && reader.idx < f.chunks.length - 1) { reader.idx++; renderReader(); } });
$('#reader').addEventListener('click', (e) => { if (e.target.id === 'reader') closeReader(); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('#reader').classList.contains('on')) closeReader();
  else if (S.drawer) closeDrawer();
  else if (S.asking) closeAsk();
});
const mat = $('#mat');
['dragenter', 'dragover'].forEach((ev) => mat.addEventListener(ev, (e) => { e.preventDefault(); mat.classList.add('drag'); }));
['dragleave', 'drop'].forEach((ev) => mat.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'dragleave' && mat.contains(e.relatedTarget)) return; mat.classList.remove('drag'); }));
mat.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ================= 시작 ================= */
async function init() {
  renderMic(); renderCaptions(); renderMaterials(); renderTop(); paintIdle(); applyScale();
  try {
    const got = await Promise.all(['files', 'segments', 'qaLog', 'settings', 'summary'].map((k) => kv.get(k)));
    const files = got[0], segs = got[1], qa = got[2], settings = got[3], summary = got[4];
    if (settings && typeof settings === 'object') Object.assign(S.settings, settings);
    let fixed = false;
    Object.keys(S.settings.models || {}).forEach((pv) => { const o = S.settings.models[pv] || {}; ['quick', 'deep'].forEach((tr) => { if (o[tr] && !cleanModel(o[tr], pv)) { delete o[tr]; fixed = true; } }); });
    if (fixed) save.settings();
    if (Array.isArray(files) && !S.files.length) S.files = files.filter((f) => f && Array.isArray(f.chunks) && f.chunks.length).map((f) => Object.assign({}, f, { status: 'ready', study: studyForSave(f.study) }));
    if (Array.isArray(segs) && !S.segments.length) S.segments = segs.filter((s) => s && s.text).map((s) => ({ id: ++segN, t: s.t, te: s.te || s.t, text: s.text }));
    if (Array.isArray(qa) && !S.qaLog.length) S.qaLog = qa;
    if (summary && summary.text && !S.summary) S.summary = Object.assign({}, summary, { status: 'done' });
  } catch (e) {}
  if (S.files.length && !fileById(S.activeFile)) S.activeFile = S.files[0].id;
  buildIndex(); buildPrepared();
  applyScale(); renderMic(); renderCaptions(); refresh();
  if (isIdle()) paintIdle();
  getSample().then((s) => { if (s) checkSampleState(false); });
  if (aiKey() && !(((S.settings.resolved || {})[aiProv()] || {}).quick)) testKey(true);
}
init();
})();
</script>
